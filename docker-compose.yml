version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soundify-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      SEARCH_SERVER_URL: http://search-server:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/__pycache__
    depends_on:
      - search-server
    networks:
      - soundify-network

  # C++ Dedicated Search Server
  search-server:
    build:
      context: ./search_server
      dockerfile: Dockerfile
    container_name: soundify-search-server
    restart: always
    ports:
      - "8080:8080"
    networks:
      - soundify-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soundify-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - soundify-network
    environment:
      VITE_API_URL: http://localhost:8000

networks:
  soundify-network:
    driver: bridge